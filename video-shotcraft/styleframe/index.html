<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北京买房竖屏宣传片 Styleframe</title>
    <style>
      :root {
        --ink: #251044;
        --muted: #756987;
        --paper: #f1eefb;
        --violet: #7760b3;
        --green: #147a5d;
        --amber: #a66b16;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 80px;
        color: var(--ink);
        background: #17111e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      h1 { margin: 0 0 48px; color: white; font-size: 42px; }
      .frames { display: flex; gap: 44px; align-items: flex-start; }
      .frame {
        position: relative;
        width: 540px;
        height: 960px;
        overflow: hidden;
        border-radius: 32px;
        background:
          radial-gradient(circle at 82% 9%, rgba(255,255,255,.95), transparent 27%),
          linear-gradient(145deg, #faf4fc 0%, #f1e8f7 55%, #e9def1 100%);
        box-shadow: 0 38px 110px rgba(0,0,0,.4);
      }
      .safe { position: absolute; inset: 52px 34px 88px; border: 1px dashed rgba(37,16,68,.12); border-radius: 28px; }
      .eyebrow { position: absolute; top: 78px; left: 52px; font-size: 14px; font-weight: 700; letter-spacing: .15em; color: var(--violet); }
      .headline { position: absolute; top: 116px; left: 52px; right: 46px; margin: 0; font-size: 54px; line-height: 1.06; letter-spacing: -.04em; }
      .headline em { color: var(--green); font-style: normal; }
      .map {
        position: absolute;
        top: 285px;
        left: -80px;
        width: 700px;
        filter: drop-shadow(0 42px 38px rgba(53,33,77,.2));
      }
      .caption {
        position: absolute;
        left: 44px;
        right: 44px;
        bottom: 98px;
        padding: 22px 28px;
        border-radius: 999px;
        color: white;
        background: rgba(37,16,68,.94);
        font-size: 23px;
        font-weight: 700;
        text-align: center;
        box-shadow: 0 18px 50px rgba(37,16,68,.22);
      }
      .panel {
        position: absolute;
        top: 250px;
        left: 46px;
        right: 46px;
        height: 500px;
        overflow: hidden;
        border-radius: 28px;
        background: rgba(255,255,255,.78);
        box-shadow: 0 28px 80px rgba(50,26,83,.18), inset 0 0 0 1px rgba(37,16,68,.08);
      }
      .score { position: absolute; top: 44px; left: 36px; display: grid; width: 96px; height: 96px; place-items: center; border-radius: 50%; color: white; background: var(--green); font-size: 34px; font-weight: 800; }
      .panel h2 { margin: 48px 30px 0 154px; font-size: 32px; }
      .panel p { margin: 10px 30px 0 154px; color: var(--green); font-size: 18px; font-weight: 700; }
      .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 62px 28px 0; }
      .metric { padding: 22px; border-radius: 18px; background: rgba(241,238,251,.84); }
      .metric small { display: block; color: var(--muted); font-size: 14px; }
      .metric b { display: block; margin-top: 8px; font-size: 22px; }
      .chart { position: absolute; inset: 190px 28px 28px; }
      .chart svg { width: 100%; height: 100%; }
      .brand-frame { position: absolute; inset: 32px; border: 8px solid var(--violet); border-radius: 36px; }
      .wordmark { position: absolute; top: 338px; left: 48px; right: 48px; text-align: center; }
      .wordmark .logo { display: grid; width: 94px; height: 94px; margin: 0 auto 30px; place-items: center; border: 3px solid var(--ink); border-radius: 50%; font-size: 44px; }
      .wordmark h2 { margin: 0; font-size: 50px; line-height: 1.06; }
      .wordmark p { margin: 20px 0 0; color: var(--muted); font-size: 21px; }
      .url { position: absolute; left: 60px; right: 60px; bottom: 210px; padding: 19px 24px; border-radius: 999px; background: white; font: 700 16px/1.3 ui-monospace, monospace; text-align: center; box-shadow: 0 18px 45px rgba(50,26,83,.12); }
    </style>
  </head>
  <body>
    <h1>城市证据航拍 · 1080×1920 关键画面</h1>
    <main class="frames">
      <section class="frame">
        <div class="safe"></div>
        <span class="eyebrow">OPEN SOURCE · BEIJING</span>
        <h2 class="headline">北京 7,972 个小区，<em>怎么买？</em></h2>
        <img class="map" src="../../public/assets/beijing-map-transparent.webp" alt="北京 3D 地图" />
        <div class="caption">从北京全图，一直看到具体小区</div>
      </section>
      <section class="frame">
        <div class="safe"></div>
        <span class="eyebrow">COMMUNITY EVIDENCE</span>
        <h2 class="headline">不是猜涨幅，<br /><em>而是看证据</em></h2>
        <div class="panel">
          <div class="score">87</div>
          <h2>白广路 6 号院</h2>
          <p>购买价值 · 优先核验</p>
          <div class="metric-grid">
            <div class="metric"><small>同质折价</small><b>+26.3%</b></div>
            <div class="metric"><small>成交样本</small><b>18 套</b></div>
            <div class="metric"><small>品质证据</small><b>82 分</b></div>
            <div class="metric"><small>流动性</small><b>91 分</b></div>
          </div>
        </div>
        <div class="caption">品质、价格机会、流动性，都有依据</div>
      </section>
      <section class="frame">
        <div class="safe"></div>
        <div class="brand-frame"></div>
        <div class="wordmark">
          <div class="logo">⌂</div>
          <h2>资产分化<br />实验室</h2>
          <p>开源北京买房决策工具</p>
        </div>
        <div class="url">github.com/LiuLi4/asset-divergence-lab</div>
        <div class="caption">本地计算 · 不上传你的数据</div>
      </section>
    </main>
  </body>
</html>
